# ============================================================================
# Dependabot — abre PRs automáticos atualizando dependências (Passo 6 do
# docs/ROTEIRO_CICD_CLAUDE_CODE.md). Cada PR passa pela esteira (ci.yml e
# docker-build.yml) como qualquer outro, então nada entra sem CI verde.
# Semanal e com limite de PRs abertos para não inundar o board.
# ============================================================================
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # ESLint 9+ exige migrar .eslintrc.json → eslint.config.js (tarefa própria).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Trocar a versão de Node/Python é decisão planejada (só LTS / manter CI,
      # Dockerfile e docs em sincronia) — o Dependabot só propõe patches.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
