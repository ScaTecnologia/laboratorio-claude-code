<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabSystem — Login</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="login-body">

  <div class="login-card">
    <a href="/" class="login-logo">Lab<span>System</span></a>
    <p class="login-subtitle">Faça login para acessar o sistema</p>

    <form id="form-login" class="login-form" onsubmit="login(event)" novalidate>
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div class="mensagem" id="mensagem" role="alert" aria-live="polite"></div>
      <button type="submit" class="btn btn-primary btn-full">Entrar</button>
    </form>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
