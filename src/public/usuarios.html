<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabSystem — Usuários</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

  <header class="header">
    <a href="/" class="header-logo">Lab<span>System</span></a>
    <nav class="nav" aria-label="Menu principal">
      <a href="/clientes.html">Clientes</a>
      <a href="/fornecedores.html">Fornecedores</a>
      <a href="/produtos.html">Produtos</a>
      <a href="/estoque.html">Estoque</a>
      <a href="/carrinho.html">Carrinho</a>
      <a href="/avaliacoes.html">Avaliações</a>
      <a href="/eventos.html">Eventos</a>
      <a href="/relatorio.html">Relatório</a>
      <a href="/usuarios.html" class="active" data-admin>Usuários</a>
      <a href="/api-docs">API Docs</a>
    </nav>
    <div class="header-user">
      <span class="header-user-nome" id="usuario-nome"></span>
      <span class="badge" id="usuario-role"></span>
      <button class="btn btn-sm btn-outline" onclick="logout()">Sair</button>
    </div>
  </header>

  <main class="main">
    <div class="container container-wide">

      <h1 class="page-title">Gerenciamento de Usuários</h1>

      <div class="cadastro-layout">

      <div class="card">
        <p class="card-title" id="form-titulo">Novo Usuário</p>
        <form id="form-usuario" onsubmit="salvar(event)" novalidate>
          <input type="hidden" id="usuario-id" />
          <div class="form-grid">
            <div class="form-group">
              <label for="nome">Nome</label>
              <input type="text" id="nome" placeholder="Nome completo" />
            </div>
            <div class="form-group">
              <label for="email">E-mail</label>
              <input type="email" id="email" placeholder="email@exemplo.com" />
            </div>
            <div class="form-group">
              <label for="senha">Senha</label>
              <input type="password" id="senha" placeholder="••••••••" />
            </div>
            <div class="form-group">
              <label for="role">Perfil</label>
              <select id="role">
                <option value="Atendente">Atendente</option>
                <option value="Admin">Admin</option>
                <option value="Visitante">Visitante</option>
              </select>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <button type="button" class="btn btn-secondary" id="btn-cancelar" onclick="cancelarEdicao()" hidden>Cancelar</button>
          </div>
        </form>
        <div class="mensagem" id="mensagem" role="alert" aria-live="polite"></div>
      </div>

      <div class="card">
        <p class="card-title">Usuários cadastrados</p>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Nome</th>
                <th scope="col">E-mail</th>
                <th scope="col">Perfil</th>
                <th scope="col">Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-body"></tbody>
          </table>
        </div>
      </div>

      </div>

    </div>
  </main>

  <footer class="footer">LabSystem &copy; 2026</footer>

  <script src="/js/auth.js"></script>
  <script src="/js/usuarios.js"></script>
</body>
</html>
